name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'contes-burkina-react-source/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contes-burkina-react-source/package-lock.json

      - name: Install dependencies
        working-directory: contes-burkina-react-source
        run: npm ci

      - name: Build site
        working-directory: contes-burkina-react-source
        run: npm run build -- --base=/Technologie_web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: contes-burkina-react-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
